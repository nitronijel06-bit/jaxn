<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>JAXN BLACK CARD</title>
<meta name="description" content="JAXN BLACK CARD — tap profile." />
<meta name="theme-color" content="#080808" />
<link rel="icon" type="image/png" href="jaxn-card.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ease:cubic-bezier(.22,1,.36,1);
    --bg:#080808;
    --accent:#c6a568;
    --accent-hi:#e5c58a;
    --accent-soft:#b39b62;
    --accent-muted:#8a744a;
    --ink:#f2ead9;
    --ink-dim:#b8b0a0;
    --panel:rgba(255,255,255,.02);
  }
  body[data-look="broadcast"]{
    --accent:#c98a4b; --accent-hi:#e8b07e; --accent-soft:#b57a3e;
    --accent-muted:#8a5f31; --ink:#f5ece1; --ink-dim:#c0ae9c;
  }
  body[data-look="creator"]{
    --accent:#a78bfa; --accent-hi:#cdbffa; --accent-soft:#8f73e8;
    --accent-muted:#6d5bb0; --ink:#efeaff; --ink-dim:#b6abcf;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',system-ui,sans-serif;font-weight:300;
    background:var(--bg);color:var(--ink);
    min-height:100vh;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:#000;}

  .bg-art{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:url('jaxn-card.png') center center/cover no-repeat;
    filter:brightness(.30);
  }
  .bg-scrim{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,
      rgba(8,8,8,.88) 0%,rgba(8,8,8,.30) 26%,
      rgba(8,8,8,.44) 55%,rgba(8,8,8,.94) 82%,#080808 100%);
  }

  .page{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:28px 22px 56px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.07);
  }
  .brand{
    font-size:10.5px;font-weight:500;letter-spacing:.42em;text-indent:.1em;
    color:var(--ink);white-space:nowrap;
  }
  .mark{
    width:15px;height:15px;flex:none;margin-left:14px;
    border:1px solid var(--accent);
    transform:rotate(45deg);
    background:linear-gradient(135deg,var(--accent-hi),var(--accent-soft));
    box-shadow:0 0 14px color-mix(in srgb,var(--accent) 45%,transparent);
  }

  .hero{padding:26px 0 8px;perspective:1200px;margin:0 -22px;}
  .card-frame{
    position:relative;transform-style:preserve-3d;
    border-top:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
    border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
    box-shadow:0 30px 70px rgba(0,0,0,.65);
    transition:transform .5s var(--ease);
    will-change:transform;
  }
  .card-frame img{width:100%;display:block;}
  .card-glare{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(420px circle at var(--gx,50%) var(--gy,50%),
      rgba(255,255,255,.16),rgba(255,255,255,.04) 42%,transparent 68%);
    mix-blend-mode:soft-light;transition:opacity .4s ease;
  }
  .card-frame.lit .card-glare{opacity:1;}
  .card-caption{
    margin-top:14px;text-align:center;
    font-size:10px;letter-spacing:.36em;text-indent:.36em;text-transform:uppercase;
    color:var(--accent-muted);
  }

  .identity{text-align:center;padding:34px 0 6px;}
  h1{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:clamp(40px,11vw,54px);line-height:1.04;letter-spacing:.14em;
    background:linear-gradient(180deg,#fdfbf7 20%,var(--accent-hi) 78%,var(--accent-soft));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    padding:0 .14em;
  }
  .tagline{
    margin-top:14px;font-size:12.5px;font-weight:400;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);line-height:1.9;
  }
  .rule{
    width:56px;height:1px;margin:24px auto 0;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
  }

  .links{display:flex;flex-direction:column;gap:12px;padding-top:30px;}
  .btn{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:16px 20px 14px;text-decoration:none;
    background:var(--panel);
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
    transition:border-color .35s ease,background .35s ease,transform .35s var(--ease);
  }
  .btn::before,.btn::after{
    content:"";position:absolute;width:9px;height:9px;pointer-events:none;
    transition:all .35s ease;
  }
  .btn::before{top:-1px;left:-1px;border-top:1px solid var(--accent-hi);border-left:1px solid var(--accent-hi);}
  .btn::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--accent-hi);border-right:1px solid var(--accent-hi);}
  .btn:hover,.btn:active{
    border-color:color-mix(in srgb,var(--accent) 65%,transparent);
    background:color-mix(in srgb,var(--accent) 7%,transparent);
    transform:translateY(-1px);
  }
  .btn .t{
    font-size:13.5px;font-weight:500;letter-spacing:.24em;text-indent:.24em;
    text-transform:uppercase;color:var(--ink);text-align:center;
  }
  .btn .s{
    font-size:11.5px;letter-spacing:.05em;color:var(--accent-soft);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .state{
    text-align:center;padding:64px 10px 10px;
  }
  .state h2{
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:32px;
    letter-spacing:.1em;color:var(--ink);line-height:1.25;
  }
  .state p{margin-top:14px;font-size:13.5px;line-height:1.8;color:var(--ink-dim);letter-spacing:.04em;}
  .state .btn{margin-top:28px;}

  footer{
    margin-top:52px;padding-top:22px;text-align:center;
    border-top:1px solid rgba(255,255,255,.06);
    font-size:9.5px;letter-spacing:.4em;text-indent:.4em;
    color:#6f6a5e;text-transform:uppercase;
  }
</style>
</head>
<body data-look="executive">

<div class="bg-art" aria-hidden="true"></div>
<div class="bg-scrim" aria-hidden="true"></div>

<div class="page">
  <div class="topbar">
    <span class="brand">JAXN&nbsp;BLACK&nbsp;CARD</span>
    <span class="mark" aria-hidden="true"></span>
  </div>

  <section class="hero" aria-label="JAXN BLACK CARD">
    <div class="card-frame" id="cardFrame">
      <img src="jaxn-card.png" alt="JAXN BLACK CARD — matte black card with gold JX monogram" />
      <div class="card-glare"></div>
    </div>
    <p class="card-caption">Member Card &mdash; NFC Enabled</p>
  </section>

  <main id="app" aria-live="polite">
    <div class="state"><p>Loading&hellip;</p></div>
  </main>

  <footer>JAXN&nbsp;BLACK&nbsp;CARD</footer>
</div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var id = (params.get('id') || '').toUpperCase().trim();

  function stateBox(title, text, btnLabel, btnHref){
    app.textContent = '';
    var box = document.createElement('div'); box.className = 'state';
    if (title){ var h = document.createElement('h2'); h.textContent = title; box.appendChild(h); }
    if (text){ var p = document.createElement('p'); p.textContent = text; box.appendChild(p); }
    if (btnLabel && btnHref){
      var a = document.createElement('a'); a.className = 'btn'; a.href = btnHref;
      var t = document.createElement('span'); t.className = 't'; t.textContent = btnLabel;
      a.appendChild(t); box.appendChild(a);
    }
    app.appendChild(box);
  }

  function subFor(url){
    if (url.indexOf('mailto:') === 0) return url.slice(7);
    if (url.indexOf('tel:') === 0) return url.slice(4);
    return url.replace(/^https?:\/\//,'').replace(/\/$/,'');
  }

  function render(p){
    document.body.setAttribute('data-look', p.look || 'executive');
    document.title = p.name + ' — JAXN BLACK CARD';
    app.textContent = '';

    var idn = document.createElement('section'); idn.className = 'identity';
    var h1 = document.createElement('h1'); h1.textContent = p.name; idn.appendChild(h1);
    if (p.tagline){
      var tg = document.createElement('p'); tg.className = 'tagline'; tg.textContent = p.tagline; idn.appendChild(tg);
    }
    var rule = document.createElement('div'); rule.className = 'rule'; idn.appendChild(rule);
    app.appendChild(idn);

    var links = document.createElement('nav'); links.className = 'links';
    links.setAttribute('aria-label', 'Links');
    (p.links || []).forEach(function(l){
      if (!l || !l.url) return;
      var a = document.createElement('a'); a.className = 'btn';
      a.href = l.url;
      if (/^https?:/i.test(l.url)) { a.target = '_blank'; a.rel = 'noopener'; }
      var t = document.createElement('span'); t.className = 't'; t.textContent = l.label || 'Link';
      var s = document.createElement('span'); s.className = 's'; s.textContent = subFor(l.url);
      a.appendChild(t); a.appendChild(s); links.appendChild(a);
    });
    app.appendChild(links);
  }

  function pingTap(){
    try {
      var w = (window.JAXN_CONFIG || {}).workerUrl;
      if (!w) return;
      var body = JSON.stringify({ id: id });
      if (navigator.sendBeacon) {
        navigator.sendBeacon(w.replace(/\/$/,'') + '/tap', new Blob([body], { type: 'application/json' }));
      }
    } catch (e) {}
  }

  if (!/^JX-\d{4}$/.test(id)) {
    stateBox('JAXN BLACK CARD',
      'This is the JAXN profile system. Tap a JAXN card to see its profile, or activate a new card.',
      'Activate a card', 'activate.html');
  } else {
    fetch('profiles.json?v=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('load'); return r.json(); })
      .then(function(all){
        var p = all[id];
        if (!p) {
          stateBox('Card ' + id,
            "This card hasn't been activated yet. If it's yours, activate it now — it takes about a minute.",
            'Activate this card', 'activate.html?id=' + encodeURIComponent(id));
          return;
        }
        if (p.status === 'off') {
          stateBox('Card unavailable', 'This card is currently switched off. Please contact JAXN BLACK CARD.');
          return;
        }
        render(p);
        pingTap();
      })
      .catch(function(){
        stateBox('Something went wrong', 'The profile could not be loaded. Please try again in a moment.');
      });
  }

  /* card tilt + glare */
  var frame = document.getElementById('cardFrame');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (frame && !reduced) {
    frame.addEventListener('pointermove', function(e){
      var r = frame.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      frame.style.transform = 'rotateY(' + ((x - .5) * 10) + 'deg) rotateX(' + ((.5 - y) * 8) + 'deg)';
      frame.style.setProperty('--gx', (x * 100) + '%');
      frame.style.setProperty('--gy', (y * 100) + '%');
      frame.classList.add('lit');
    });
    frame.addEventListener('pointerleave', function(){
      frame.style.transform = ''; frame.classList.remove('lit');
    });
  }
})();
</script>
</body>
</html>
